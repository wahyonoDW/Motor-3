<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jelajah Motocross 3D - Labirin Dinamis Kelas 3</title>
<style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
        background: #000;
    }

    /* === ANIMATED BACKGROUND === */
    .bg-3d {
        position: fixed; inset: 0; z-index: 0;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,152,0,0.25), transparent 45%),
            radial-gradient(circle at 80% 80%, rgba(76,175,80,0.25), transparent 45%),
            linear-gradient(135deg, #0d1a10 0%, #1b5e20 50%, #0d1a10 100%);
        background-size: 200% 200%;
        animation: bgShift 18s ease-in-out infinite;
    }
    @keyframes bgShift {
        0%, 100% { background-position: 0% 0%, 100% 100%, 0% 50%; }
        50%      { background-position: 100% 100%, 0% 0%, 100% 50%; }
    }
    .floating-dot {
        position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
        background: radial-gradient(circle, rgba(255,235,59,0.9), rgba(255,152,0,0));
        animation: floatUp linear infinite;
        opacity: 0.55;
    }
    @keyframes floatUp {
        from { transform: translateY(100vh) scale(0.4); opacity: 0; }
        20%  { opacity: 0.7; }
        to   { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* === SCREENS === */
    #login-screen, #game-screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 2;
    }
    #game-screen { display: none; }

    /* === 3D LOGIN BOX === */
    .window-box {
        position: relative;
        background: linear-gradient(160deg, #6d4c41 0%, #4e342e 55%, #2d1a15 100%);
        border: 1px solid rgba(255,183,77,0.7);
        border-radius: 24px;
        padding: 34px 28px 30px;
        width: 90%; max-width: 440px;
        text-align: center;
        color: #fff;
        transform-style: preserve-3d;
        transform: perspective(1200px) rotateX(3deg);
        animation: cardIn 0.7s cubic-bezier(.2,.9,.3,1.3) both;
        box-shadow:
            0 1px 0 rgba(255,255,255,0.15) inset,
            0 -10px 40px rgba(0,0,0,0.55) inset,
            0 20px 0 -6px #1a0d09,
            0 30px 55px rgba(0,0,0,0.75),
            0 0 65px rgba(255,152,0,0.35);
    }
    .window-box::before {
        content: ""; position: absolute; inset: -3px; border-radius: 26px;
        background: linear-gradient(135deg, #ffb74d, #e65100, #ffb74d);
        z-index: -1; filter: blur(14px); opacity: 0.55;
    }
    @keyframes cardIn {
        from { opacity: 0; transform: perspective(1200px) rotateX(-22deg) translateY(60px) scale(0.9); }
        to   { opacity: 1; transform: perspective(1200px) rotateX(3deg) translateY(0) scale(1); }
    }

    .logo-container { perspective: 800px; margin-bottom: 8px; }
    .logo-container img {
        max-width: 110px; height: auto;
        border-radius: 20px;
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6)) drop-shadow(0 0 22px rgba(255,183,77,0.7));
        animation: logoBob 3s ease-in-out infinite;
    }
    @keyframes logoBob {
        0%,100% { transform: translateY(0) rotateY(0deg); }
        50%     { transform: translateY(-6px) rotateY(12deg); }
    }

    h1 {
        color: #ffeb3b; font-size: 26px; margin: 6px 0 4px; letter-spacing: 1.5px;
        text-shadow:
            0 1px 0 #fff59d,
            0 2px 0 #f57f17,
            0 3px 0 #e65100,
            0 4px 0 #bf360c,
            0 6px 12px rgba(0,0,0,0.7);
    }
    h2 { color: #ffb74d; font-size: 15px; margin: 0 0 22px; letter-spacing: 0.5px; }

    .form-group { margin-bottom: 18px; text-align: left; }
    label {
        display: block; font-size: 13px; color: #ffcc80; margin-bottom: 6px;
        font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }
    input[type="text"], input[type="date"] {
        width: 100%; padding: 13px 14px;
        border: none; border-radius: 12px;
        background: linear-gradient(180deg, #fffaf0, #f5e6d3);
        color: #3e2723; font-size: 16px; font-family: inherit;
        outline: none;
        box-shadow:
            0 3px 0 #8d6e63,
            0 6px 12px rgba(0,0,0,0.45),
            inset 0 2px 4px rgba(0,0,0,0.08);
        transition: transform 0.15s;
    }
    input[type="text"]:focus, input[type="date"]:focus {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 #8d6e63, 0 10px 18px rgba(0,0,0,0.5);
    }

    .btn-start {
        background: linear-gradient(180deg, #ffca28, #ff9800 45%, #e65100);
        color: #fff; border: none;
        padding: 16px 30px;
        font-family: inherit; font-size: 18px; font-weight: bold; letter-spacing: 1px;
        border-radius: 50px; cursor: pointer;
        width: 100%;
        text-shadow: 0 2px 3px rgba(0,0,0,0.5);
        box-shadow:
            0 7px 0 #bf360c,
            0 12px 20px rgba(0,0,0,0.55),
            inset 0 2px 0 rgba(255,255,255,0.55);
        transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-start:active {
        transform: translateY(5px);
        box-shadow:
            0 2px 0 #bf360c,
            0 4px 10px rgba(0,0,0,0.5),
            inset 0 2px 0 rgba(255,255,255,0.55);
    }

    /* === HUD === */
    .hud {
        position: absolute; top: 12px; left: 12px; right: 12px;
        display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
        color: #fff; font-size: 13px; font-weight: bold; z-index: 5;
        background: linear-gradient(180deg, rgba(62,39,35,0.95), rgba(35,20,15,0.95));
        padding: 10px 14px; border-radius: 12px;
        border: 1px solid rgba(255,183,77,0.7);
        box-shadow:
            0 4px 0 #1a0d09,
            0 10px 18px rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(255,255,255,0.15);
        pointer-events: none;
    }
    .hud-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .hud-item span { color: #ffeb3b; text-shadow: 0 0 8px rgba(255,235,59,0.6); }

    /* === CANVAS === */
    #canvas-container { position: relative; width: 100%; height: 100%; z-index: 2; }
    canvas { display: block; }

    /* === 3D CONTROL BUTTONS === */
    #controls-container {
        position: absolute; bottom: 16px; left: 0; width: 100%;
        display: flex; justify-content: space-between; padding: 0 20px; z-index: 5;
    }
    .control-group {
        display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 8px;
    }
    .btn-ctrl {
        background: linear-gradient(180deg, rgba(255,152,0,0.85), rgba(191,54,12,0.9));
        border: 1px solid rgba(255,235,59,0.6);
        color: #fff; border-radius: 50%;
        font-size: 24px; font-weight: bold;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; width: 58px; height: 58px;
        touch-action: manipulation;
        text-shadow: 0 2px 3px rgba(0,0,0,0.6);
        box-shadow:
            0 5px 0 rgba(90,25,5,0.95),
            0 8px 15px rgba(0,0,0,0.5),
            inset 0 2px 0 rgba(255,255,255,0.35);
        transition: transform 0.06s, box-shadow 0.06s;
    }
    .btn-ctrl:active {
        transform: translateY(4px);
        box-shadow:
            0 1px 0 rgba(90,25,5,0.95),
            0 3px 8px rgba(0,0,0,0.5),
            inset 0 2px 0 rgba(255,255,255,0.35);
    }

    /* === QUIZ OVERLAY 3D === */
    #quiz-overlay {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(20,10,5,0.75), rgba(0,0,0,0.92));
        display: flex; justify-content: center; align-items: center;
        z-index: 20; display: none;
        perspective: 1400px;
    }
    .quiz-box {
        background: linear-gradient(160deg, #ffffff 0%, #fff8e1 60%, #ffe0b2 100%);
        border: 1px solid #ffb74d;
        border-radius: 22px;
        padding: 24px; width: 92%; max-width: 520px;
        text-align: center; color: #3e2723;
        animation: quizIn 0.5s cubic-bezier(.2,.9,.3,1.3) both;
        box-shadow:
            0 1px 0 rgba(255,255,255,0.9) inset,
            0 -8px 30px rgba(255,152,0,0.25) inset,
            0 14px 0 -4px #b26a00,
            0 26px 40px rgba(0,0,0,0.7),
            0 0 70px rgba(255,183,77,0.5);
    }
    @keyframes quizIn {
        from { opacity: 0; transform: rotateX(-25deg) translateY(80px) scale(0.85); }
        to   { opacity: 1; transform: rotateX(0) translateY(0) scale(1); }
    }
    .quiz-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 14px; border-bottom: 2px dashed #e65100; padding-bottom: 10px;
    }
    #quiz-level {
        background: linear-gradient(180deg, #ff9800, #e65100);
        color: #fff; padding: 6px 14px; border-radius: 20px;
        font-size: 13px; font-weight: bold;
        text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        box-shadow: 0 3px 0 #bf360c, 0 4px 8px rgba(0,0,0,0.35);
    }
    #quiz-timer {
        font-size: 17px; font-weight: bold; color: #fff;
        background: linear-gradient(180deg, #ef5350, #c62828);
        padding: 5px 14px; border-radius: 12px;
        box-shadow: 0 3px 0 #7f0000, 0 4px 10px rgba(0,0,0,0.35);
        min-width: 62px;
    }
    #quiz-timer.warning { animation: pulseWarn 0.6s infinite; }
    @keyframes pulseWarn {
        0%,100% { transform: scale(1); }
        50%     { transform: scale(1.12); }
    }
    #question-text {
        font-size: 19px; font-weight: bold; margin-bottom: 18px;
        color: #4e342e; line-height: 1.4;
        text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }
    .options-grid { display: flex; flex-direction: column; gap: 11px; margin-bottom: 18px; }
    .option-btn {
        background: linear-gradient(180deg, #ffffff, #f5ebe0);
        border: 1px solid #ffcc80; border-radius: 13px;
        padding: 14px 16px; font-family: inherit;
        font-size: 15.5px; font-weight: bold; text-align: left;
        cursor: pointer; color: #4e342e;
        box-shadow:
            0 4px 0 #d7ccc8,
            0 6px 12px rgba(0,0,0,0.18),
            inset 0 1px 0 rgba(255,255,255,0.9);
        transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
    }
    .option-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .option-btn:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #d7ccc8, 0 2px 5px rgba(0,0,0,0.2);
    }
    .option-btn.correct {
        background: linear-gradient(180deg, #a5d6a7, #66bb6a) !important;
        border-color: #2e7d32 !important; color: #1b5e20 !important;
        box-shadow: 0 4px 0 #1b5e20, 0 6px 14px rgba(27,94,32,0.5) !important;
        animation: correctPop 0.4s;
    }
    .option-btn.wrong {
        background: linear-gradient(180deg, #ef9a9a, #e57373) !important;
        border-color: #c62828 !important; color: #b71c1c !important;
        box-shadow: 0 4px 0 #7f0000, 0 6px 14px rgba(127,0,0,0.5) !important;
        animation: wrongShake 0.4s;
    }
    @keyframes correctPop {
        0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); }
    }
    @keyframes wrongShake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }
    #next-btn {
        background: linear-gradient(180deg, #66bb6a, #2e7d32);
        color: #fff; border: none;
        padding: 14px 30px; font-family: inherit;
        font-size: 16px; font-weight: bold; letter-spacing: 0.8px;
        border-radius: 30px; cursor: pointer; display: none; width: 100%;
        text-shadow: 0 2px 3px rgba(0,0,0,0.4);
        box-shadow: 0 6px 0 #1b5e20, 0 10px 18px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.4);
        transition: transform 0.08s, box-shadow 0.08s;
    }
    #next-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #1b5e20, 0 4px 8px rgba(0,0,0,0.4);
    }

    /* === END SCREEN === */
    #end-overlay {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 40%, rgba(62,39,35,0.96), rgba(15,7,5,0.98));
        display: none; justify-content: center; align-items: center; z-index: 30;
        perspective: 1400px;
    }
    .end-box {
        background: linear-gradient(160deg, #6d4c41, #3e2723 60%, #1a0d09);
        border: 1px solid #ffeb3b; border-radius: 26px;
        padding: 36px 28px; width: 90%; max-width: 440px;
        text-align: center; color: #fff;
        animation: quizIn 0.6s cubic-bezier(.2,.9,.3,1.3) both;
        box-shadow:
            0 1px 0 rgba(255,255,255,0.15) inset,
            0 16px 0 -6px #0d0503,
            0 26px 50px rgba(0,0,0,0.8),
            0 0 80px rgba(255,235,59,0.35);
    }
    .end-title {
        font-size: 30px; color: #ffeb3b; margin-bottom: 18px;
        text-shadow: 0 2px 0 #f57f17, 0 4px 0 #bf360c, 0 8px 15px rgba(0,0,0,0.7);
        letter-spacing: 1.5px;
    }
    .end-stats { font-size: 17px; margin: 8px 0; color: #ffe0b2; }
    .end-stats strong { color: #ffeb3b; font-size: 20px; }
    .btn-restart {
        margin-top: 24px;
        background: linear-gradient(180deg, #66bb6a, #2e7d32);
        color: #fff; border: none; padding: 15px 34px;
        font-family: inherit; font-size: 17px; font-weight: bold;
        border-radius: 50px; cursor: pointer; width: 100%;
        letter-spacing: 1px; text-shadow: 0 2px 3px rgba(0,0,0,0.4);
        box-shadow: 0 7px 0 #1b5e20, 0 12px 20px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.4);
        transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-restart:active {
        transform: translateY(5px);
        box-shadow: 0 2px 0 #1b5e20, 0 4px 10px rgba(0,0,0,0.5);
    }

    /* === SUBJECT BADGE === */
    .subject-badge {
        display: inline-block; font-size: 11px; padding: 3px 10px;
        border-radius: 10px; margin-left: 6px; font-weight: bold;
        vertical-align: middle;
    }
    .sub-mat { background: #1565c0; color: #fff; }
    .sub-bin { background: #c62828; color: #fff; }
    .sub-ipa { background: #2e7d32; color: #fff; }
    .sub-ips { background: #6a1b9a; color: #fff; }
    .sub-ppkn{ background: #ef6c00; color: #fff; }
</style>
</head>
<body>

<div class="bg-3d"></div>

<!-- ============== LOGIN SCREEN ============== -->
<div id="login-screen">
    <div class="window-box">
        <div class="logo-container">
            <img src="https://drive.google.com/thumbnail?id=19gOxPGN2oPJgTlnVsftcvoPHrSe41CdR&sz=w300"
                 alt="Logo SDN Kalisari"
                 onerror="this.src='https://placehold.co/150x150/5d4037/ff9800?text=SDN'">
        </div>
        <h1>JELAJAH MOTOCROSS 3D</h1>
        <h2>SDN Kalisari • Labirin Dinamis Kelas 3</h2>
        <form id="identity-form" onsubmit="startGame(event)">
            <div class="form-group">
                <label for="student-name">🏍️ Nama Lengkap Rider:</label>
                <input type="text" id="student-name" required placeholder="Ketik namamu di sini..." autocomplete="off">
            </div>
            <div class="form-group">
                <label for="student-dob">📅 Tanggal Lahir:</label>
                <input type="date" id="student-dob" required>
            </div>
            <button type="submit" class="btn-start">🚀 MULAI BALAPAN!</button>
        </form>
    </div>
</div>

<!-- ============== GAME SCREEN ============== -->
<div id="game-screen">
    <div id="canvas-container">
        <div class="hud">
            <div class="hud-item">🏍️ <span id="hud-name">-</span></div>
            <div class="hud-item">🗺️ <span id="hud-level-txt">Level 1</span></div>
            <div class="hud-item">📝 <span id="hud-progress">0/30</span></div>
            <div class="hud-item">⭐ <span id="hud-score">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>

        <div id="controls-container">
            <div class="control-group">
                <button class="btn-ctrl" onmousedown="move('left')" onmouseup="stopMove('left')"
                        ontouchstart="event.preventDefault();move('left')" ontouchend="stopMove('left')">◀</button>
                <button class="btn-ctrl" style="visibility:hidden;"></button>
                <button class="btn-ctrl" onmousedown="move('right')" onmouseup="stopMove('right')"
                        ontouchstart="event.preventDefault();move('right')" ontouchend="stopMove('right')">▶</button>
            </div>
            <div class="control-group">
                <button class="btn-ctrl" onmousedown="move('up')" onmouseup="stopMove('up')"
                        ontouchstart="event.preventDefault();move('up')" ontouchend="stopMove('up')">▲</button>
                <button class="btn-ctrl" style="visibility:hidden;"></button>
                <button class="btn-ctrl" onmousedown="move('down')" onmouseup="stopMove('down')"
                        ontouchstart="event.preventDefault();move('down')" ontouchend="stopMove('down')">▼</button>
            </div>
        </div>
    </div>

    <div id="quiz-overlay">
        <div class="quiz-box">
            <div class="quiz-header">
                <div id="quiz-level">SOAL</div>
                <div id="quiz-timer">30s</div>
            </div>
            <div id="question-text">Memuat pertanyaan...</div>
            <div class="options-grid" id="options-container"></div>
            <button id="next-btn" onclick="closeQuiz()">LANJUT TRACK ➔</button>
        </div>
    </div>
</div>

<div id="end-overlay">
    <div class="end-box">
        <div class="end-title">🏁 FINISH BALAPAN! 🏁</div>
        <div class="end-stats">Nama Rider: <strong id="end-name">-</strong></div>
        <div class="end-stats">Nilai Akhir: <strong id="end-score">0</strong></div>
        <p id="end-comment" style="color:#ffeb3b; font-weight:bold; margin-top:18px; font-size:15px;"></p>
        <button class="btn-restart" onclick="location.reload()">🔄 MAIN LAGI</button>
    </div>
</div>

<script>
/* ========================================================
   SECURITY CONTROL (ANTI CHEAT)
   ======================================================== */
let gameActive = false;
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && gameActive) {
        alert("🚨 HAK AKSES BATAL!\nKamu terdeteksi membuka tab lain. Skor diset ke 0!");
        location.reload();
    }
});

/* ========================================================
   FLOATING PARTICLES BACKGROUND
   ======================================================== */
(function spawnParticlesBg() {
    for (let i = 0; i < 22; i++) {
        const d = document.createElement('div');
        d.className = 'floating-dot';
        const size = 4 + Math.random() * 10;
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        d.style.left = Math.random() * 100 + 'vw';
        d.style.animationDuration = (10 + Math.random() * 12) + 's';
        d.style.animationDelay = (-Math.random() * 15) + 's';
        document.body.appendChild(d);
    }
})();

/* ========================================================
   WEB AUDIO SYNTHESIZER
   ======================================================== */
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'start') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.linearRampToValueAtTime(220, now + 0.35);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
            osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.linearRampToValueAtTime(440, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, now);
            osc.frequency.setValueAtTime(659, now + 0.1);
            osc.frequency.setValueAtTime(784, now + 0.2);
            osc.frequency.setValueAtTime(1046, now + 0.3);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.42);
            osc.start(now); osc.stop(now + 0.42);
        } else if (type === 'wrong' || type === 'bounce') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.18);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    } catch (e) {}
}

/* ========================================================
   BANK SOAL KELAS 3 SD - MULTIMAPEL
   ======================================================== */

   ENGINE LABIRIN 3D - PROCEDURAL (BERUBAH SETIAP SOAL)
   ======================================================== */

let currentMaze = null;

/* ========================================================
   GENERATOR LABIRIN (Recursive Backtracker + extra openings)
   ======================================================== */
function generateMaze() {
    const COLS = 15, ROWS = 11;
    const maze = Array.from({ length: ROWS }, () => Array(COLS).fill(1));

    // Mulai dari (1,1) - selalu ganjil
    const stack = [[1, 1]];
    maze[1][1] = 0;
    const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];

    while (stack.length) {
        const [r, c] = stack[stack.length - 1];
        const neighbors = [];
        for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr > 0 && nr < ROWS - 1 && nc > 0 && nc < COLS - 1 && maze[nr][nc] === 1) {
                neighbors.push([nr, nc, r + dr / 2, c + dc / 2]);
            }
        }
        if (neighbors.length === 0) {
            stack.pop();
        } else {
            const [nr, nc, mr, mc] = neighbors[Math.floor(Math.random() * neighbors.length)];
            maze[mr][mc] = 0;
            maze[nr][nc] = 0;
            stack.push([nr, nc]);
        }
    }

    // Tambahkan beberapa bukaan acak supaya labirin lebih terbuka (tidak terlalu sempit)
    const extraOpenings = 6 + Math.floor(Math.random() * 6);
    for (let i = 0; i < extraOpenings; i++) {
        const r = 1 + Math.floor(Math.random() * (ROWS - 2));
        const c = 1 + Math.floor(Math.random() * (COLS - 2));
        if (maze[r][c] === 1) maze[r][c] = 0;
    }

    // Pastikan start selalu terbuka
    maze[1][1] = 0;

    return maze;
}

/* ========================================================
   BFS : Cari posisi terjauh yang masih bisa dijangkau
   (menjamin bendera SELALU bisa dicapai, tapi tetap menantang)
   ======================================================== */
function findFarReachableCell(maze, startR, startC) {
    const ROWS = maze.length, COLS = maze[0].length;
    const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
    const queue = [[startR, startC]];
    dist[startR][startC] = 0;
    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
    const cells = [];

    while (queue.length) {
        const [r, c] = queue.shift();
        cells.push([r, c, dist[r][c]]);
        for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS &&
                maze[nr][nc] === 0 && dist[nr][nc] === -1) {
                dist[nr][nc] = dist[r][c] + 1;
                queue.push([nr, nc]);
            }
        }
    }

    // Urutkan dari yang terjauh, lalu pilih acak dari 5 teratas (variasi)
    cells.sort((a, b) => b[2] - a[2]);
    const topN = Math.min(5, cells.length);
    const pick = cells[Math.floor(Math.random() * topN)];
    return [pick[0], pick[1]];
}

let cellSize = 40, offsetX = 0, offsetY = 0;
let mazeCache = null, cachedLevel = -1, cachedW = 0, cachedH = 0;
let shakeTime = 0;

function getActiveMazeIndex() {
    let idx = Math.floor(indeksSoalSekarang / 6);
    return idx > 4 ? 4 : idx;
}

function initLayout() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const scaleX = canvas.width / 15;
    const scaleY = (canvas.height - 130) / 11;
    cellSize = Math.min(scaleX, scaleY, 54);

    offsetX = (canvas.width - (15 * cellSize)) / 2;
    offsetY = 90;

    /* ==== KUNCI UTAMA : GENERATE LABIRIN BARU SETIAP KALI initLayout DIPANGGIL ==== */
    currentMaze = generateMaze();

    // Player selalu di (1,1)
    player.x = offsetX + cellSize + (cellSize - player.size) / 2;
    player.y = offsetY + cellSize + (cellSize - player.size) / 2;

    respawnFinishFlag();
    mazeCache = null; cachedLevel = -1;
}

function respawnFinishFlag() {
    /* Cari posisi bendera TERJAUH yang masih dapat dijangkau dari start.
       Karena dipilih dari 5 kandidat terjauh secara acak, posisi bendera
       akan selalu berbeda-beda setiap soal. */
    const [fr, fc] = findFarReachableCell(currentMaze, 1, 1);
    finishFlag.x = offsetX + fc * cellSize + (cellSize - finishFlag.size) / 2;
    finishFlag.y = offsetY + fr * cellSize + (cellSize - finishFlag.size) / 2;
}

/* ========================================================
   RENDER MAZE 3D KE OFFSCREEN CANVAS (CACHE)
   ======================================================== */
function buildMazeCache(lvlIdx) {
    const off = document.createElement("canvas");
    off.width = canvas.width;
    off.height = canvas.height;
    const o = off.getContext("2d");

    const theme = levelColors[lvlIdx];
    const maze = currentMaze;

    // Latar belakang
    const bgGrad = o.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 40,
        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) / 1.4);
    bgGrad.addColorStop(0, theme.bg);
    bgGrad.addColorStop(1, "#000");
    o.fillStyle = bgGrad;
    o.fillRect(0, 0, canvas.width, canvas.height);

    // === LAPIS 1: JALAN ===
    for (let r = 0; r < 11; r++) {
        for (let c = 0; c < 15; c++) {
            if (maze[r][c] !== 0) continue;
            const px = offsetX + c * cellSize;
            const py = offsetY + r * cellSize;
            const cx = px + cellSize / 2, cy = py + cellSize / 2;

            const rg = o.createRadialGradient(cx, cy, 0, cx, cy, cellSize * 0.75);
            rg.addColorStop(0, theme.roadL);
            rg.addColorStop(1, theme.road);
            o.fillStyle = rg;
            o.fillRect(px, py, cellSize, cellSize);

            // bercak tekstur kecil
            o.fillStyle = "rgba(0,0,0,0.08)";
            for (let i = 0; i < 3; i++) {
                const dx = px + ((r * 7 + c * 13 + i * 17) % (cellSize - 4)) + 2;
                const dy = py + ((r * 11 + c * 5 + i * 23) % (cellSize - 4)) + 2;
                o.fillRect(dx, dy, 2, 2);
            }
            o.strokeStyle = "rgba(0,0,0,0.14)";
            o.lineWidth = 1;
            o.strokeRect(px + 0.5, py + 0.5, cellSize - 1, cellSize - 1);
        }
    }

    // === LAPIS 2: BAYANGAN DINDING ===
    o.fillStyle = "rgba(0,0,0,0.42)";
    for (let r = 0; r < 11; r++) {
        for (let c = 0; c < 15; c++) {
            if (maze[r][c] !== 1) continue;
            const px = offsetX + c * cellSize;
            const py = offsetY + r * cellSize;
            o.fillRect(px + 5, py + 5, cellSize, cellSize);
        }
    }

    // === LAPIS 3: DINDING DENGAN GRADIEN 3D ===
    const wallDepth = Math.max(4, cellSize * 0.12);
    for (let r = 0; r < 11; r++) {
        for (let c = 0; c < 15; c++) {
            if (maze[r][c] !== 1) continue;
            const px = offsetX + c * cellSize;
            const py = offsetY + r * cellSize;

            const sideGrad = o.createLinearGradient(px, py + cellSize - wallDepth, px, py + cellSize + 2);
            sideGrad.addColorStop(0, theme.wMid);
            sideGrad.addColorStop(1, theme.wDark);
            o.fillStyle = sideGrad;
            o.fillRect(px, py + cellSize - wallDepth, cellSize, wallDepth + 2);

            const sideR = o.createLinearGradient(px + cellSize - wallDepth, py, px + cellSize + 2, py);
            sideR.addColorStop(0, theme.wMid);
            sideR.addColorStop(1, "rgba(0,0,0,0.55)");
            o.fillStyle = sideR;
            o.fillRect(px + cellSize - wallDepth, py, wallDepth + 2, cellSize);

            const topGrad = o.createLinearGradient(px, py, px, py + cellSize);
            topGrad.addColorStop(0, theme.wTop);
            topGrad.addColorStop(0.55, theme.wMid);
            topGrad.addColorStop(1, theme.wDark);
            o.fillStyle = topGrad;
            o.fillRect(px, py, cellSize, cellSize - wallDepth);

            const hl = o.createLinearGradient(px, py, px + cellSize, py + cellSize * 0.4);
            hl.addColorStop(0, theme.wHi);
            hl.addColorStop(1, "rgba(255,255,255,0)");
            o.fillStyle = hl;
            o.fillRect(px, py, cellSize, Math.max(3, cellSize * 0.18));

            o.fillStyle = "rgba(255,255,255,0.28)";
            o.fillRect(px, py, Math.max(2, cellSize * 0.08), cellSize - wallDepth);

            o.fillStyle = "rgba(0,0,0,0.35)";
            o.fillRect(px, py + cellSize - wallDepth - 2, cellSize, 2);

            o.fillStyle = "rgba(0,0,0,0.28)";
            o.fillRect(px + cellSize - wallDepth - 1, py, 1.5, cellSize - wallDepth);
        }
    }

    mazeCache = off;
    cachedLevel = lvlIdx;
    cachedW = canvas.width;
    cachedH = canvas.height;
}

/* ========================================================
   PARTIKEL
   ======================================================== */
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5 - 1,
            life: 1, color,
            size: 3 + Math.random() * 4
        });
    }
}
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.15; p.vx *= 0.97;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

});

function stopMove(dir) { inputKeys[dir] = false; }

/* ========================================================
   KOLISI & UPDATE GAME
   ======================================================== */
function checkWallCollision(newX, newY) {
    const pts = [
        { x: newX, y: newY },
        { x: newX + player.size, y: newY },
        { x: newX, y: newY + player.size },
        { x: newX + player.size, y: newY + player.size }
    ];
    const maze = currentMaze;
    for (const p of pts) {
        const cx = Math.floor((p.x - offsetX) / cellSize);
        const cy = Math.floor((p.y - offsetY) / cellSize);
        if (cx < 0 || cx >= 15 || cy < 0 || cy >= 11) return true;
        if (maze[cy][cx] === 1) return true;
    }
    return false;
}

function updateGame() {
    if (!gameActive) return;
    const lvlIdx = getActiveMazeIndex();
    const theme = levelColors[lvlIdx];

    document.getElementById("hud-level-txt").innerText = theme.name;

    // ==== UPDATE PLAYER ====
    let nextX = player.x, nextY = player.y;
    if (inputKeys.up)    nextY -= player.speed;
    if (inputKeys.down)  nextY += player.speed;
    if (inputKeys.left)  nextX -= player.speed;
    if (inputKeys.right) nextX += player.speed;

    let moved = false;
    if (!checkWallCollision(nextX, player.y)) { player.x = nextX; moved = true; }
    else { playSound('bounce'); shakeTime = 8; }
    if (!checkWallCollision(player.x, nextY)) { player.y = nextY; moved = true; }
    else { playSound('bounce'); shakeTime = 8; }

    if (moved && Math.random() < 0.35) {
        spawnParticles(
            player.x + player.size / 2,
            player.y + player.size - 2,
            "rgba(200,200,200,0.8)", 1
        );
    }

    // ==== RENDER ====
    let shakeX = 0, shakeY = 0;
    if (shakeTime > 0) {
        shakeX = (Math.random() - 0.5) * shakeTime * 0.8;
        shakeY = (Math.random() - 0.5) * shakeTime * 0.8;
        shakeTime *= 0.8;
        if (shakeTime < 0.5) shakeTime = 0;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    if (cachedLevel !== lvlIdx || !mazeCache ||
        cachedW !== canvas.width || cachedH !== canvas.height) {
        buildMazeCache(lvlIdx);
    }
    ctx.drawImage(mazeCache, 0, 0);

    // ==== FINISH FLAG ====
    const t = performance.now() / 400;
    const flagBob = Math.sin(t) * 3;
    const flagGlow = 0.55 + 0.45 * Math.sin(t * 2);

    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(finishFlag.x + finishFlag.size / 2,
                finishFlag.y + finishFlag.size + 4,
                finishFlag.size * 0.55, finishFlag.size * 0.22,
                0, 0, Math.PI * 2);
    ctx.fill();

    const halo = ctx.createRadialGradient(
        finishFlag.x + finishFlag.size / 2, finishFlag.y + finishFlag.size / 2 + flagBob, 4,
        finishFlag.x + finishFlag.size / 2, finishFlag.y + finishFlag.size / 2 + flagBob, finishFlag.size * 1.6);
    halo.addColorStop(0, "rgba(255,235,59," + flagGlow + ")");
    halo.addColorStop(1, "rgba(255,152,0,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(finishFlag.x + finishFlag.size / 2,
            finishFlag.y + finishFlag.size / 2 + flagBob,
            finishFlag.size * 1.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = finishFlag.size + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🏁",
        finishFlag.x + finishFlag.size / 2,
        finishFlag.y + finishFlag.size / 2 + flagBob);

    // ==== PLAYER ====
    const px = player.x + player.size / 2;
    const py = player.y + player.size / 2;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.ellipse(px + 3, py + player.size * 0.55,
                player.size * 0.6, player.size * 0.28,
                0, 0, Math.PI * 2);
    ctx.fill();

    const playerGlow = ctx.createRadialGradient(px, py, 2, px, py, player.size * 1.5);
    playerGlow.addColorStop(0, "rgba(255,235,59,0.55)");
    playerGlow.addColorStop(1, "rgba(255,152,0,0)");
    ctx.fillStyle = playerGlow;
    ctx.beginPath();
    ctx.arc(px, py, player.size * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = (player.size * 1.35) + "px Arial";
    ctx.fillText("🏍️", px, py);

    updateParticles();
    drawParticles();

    ctx.restore();

    // ==== CEK FINISH ====
    if (player.x < finishFlag.x + finishFlag.size &&
        player.x + player.size > finishFlag.x &&
        player.y < finishFlag.y + finishFlag.size &&
        player.y + player.size > finishFlag.y) {
        playSound('hit');
        spawnParticles(px, py, "#ffeb3b", 26);
        spawnParticles(px, py, "#ff9800", 20);
        (function anim() {
            ctx.save();
            if (cachedLevel !== lvlIdx) buildMazeCache(lvlIdx);
            ctx.drawImage(mazeCache, 0, 0);
            updateParticles();
            drawParticles();
            ctx.restore();
            if (particles.length > 0) requestAnimationFrame(anim);
            else openQuiz();
        })();
        return;
    }

    requestAnimationFrame(updateGame);
}

/* ========================================================
   MODAL KUIS 3D
   ======================================================== */
let quizTimerInterval = null;
let sisaWaktu = 30;
let sudahMenjawab = false;

function openQuiz() {
    inputKeys = { up: false, down: false, left: false, right: false };
    const dataSoal = susunanSoal[indeksSoalSekarang];
    sudahMenjawab = false;

    const sub = subjectInfo[dataSoal.sub];
    document.getElementById("quiz-level").innerHTML =
        `SOAL ${indeksSoalSekarang + 1}/30 <span class="subject-badge ${sub.cls}">${sub.label}</span>`;
    document.getElementById("question-text").innerText = dataSoal.q;
    document.getElementById("next-btn").style.display = "none";

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    dataSoal.a.forEach(opsi => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opsi;
        btn.onclick = () => verifikasiJawaban(btn, opsi, dataSoal.c);
        optionsContainer.appendChild(btn);
    });

    sisaWaktu = 30;
    const timerEl = document.getElementById("quiz-timer");
    timerEl.innerText = sisaWaktu + "s";
    timerEl.classList.remove("warning");
    document.getElementById("quiz-overlay").style.display = "flex";

    clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(() => {
        sisaWaktu--;
        timerEl.innerText = sisaWaktu + "s";
        if (sisaWaktu <= 10) timerEl.classList.add("warning");
        if (sisaWaktu <= 0) {
            clearInterval(quizTimerInterval);
            kunciWaktuHabis(dataSoal.c);
        }
    }, 1000);
}

function verifikasiJawaban(selectedBtn, jawabanSiswa, jawabanBenar) {
    if (sudahMenjawab) return;
    sudahMenjawab = true;
    clearInterval(quizTimerInterval);
    document.getElementById("quiz-timer").classList.remove("warning");

    const semuaTombol = document.querySelectorAll(".option-btn");
    semuaTombol.forEach(b => b.disabled = true);

    if (jawabanSiswa === jawabanBenar) {
        selectedBtn.classList.add("correct");
        totalSkor += 4;
        document.getElementById("hud-score").innerText = totalSkor;
        playSound('correct');
    } else {
        selectedBtn.classList.add("wrong");
        semuaTombol.forEach(b => {
            if (b.innerText === jawabanBenar) b.classList.add("correct");
        });
        playSound('wrong');
    }
    document.getElementById("next-btn").style.display = "block";
}

function kunciWaktuHabis(jawabanBenar) {
    sudahMenjawab = true;
    const semuaTombol = document.querySelectorAll(".option-btn");
    semuaTombol.forEach(b => {
        b.disabled = true;
        if (b.innerText === jawabanBenar) b.classList.add("correct");
    });
    playSound('wrong');
    document.getElementById("next-btn").style.display = "block";
}

function closeQuiz() {
    document.getElementById("quiz-overlay").style.display = "none";
    indeksSoalSekarang++;
    document.getElementById("hud-progress").innerText = indeksSoalSekarang + "/30";

    if (indeksSoalSekarang >= 30) {
        endGame();
    } else {
        // initLayout() -> generateMaze() -> LABIRIN BARU + BENDERA BARU
        initLayout();
        requestAnimationFrame(updateGame);
    }
}

/* ========================================================
   START & END GAME
   ======================================================== */
function startGame(event) {
    event.preventDefault();
    initAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();

    siswaNama = document.getElementById("student-name").value;
    document.getElementById("hud-name").innerText = siswaNama;

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "flex";

    susunSoalUjian();
    initLayout();

    gameActive = true;
    playSound('start');
    requestAnimationFrame(updateGame);
}

function endGame() {
    gameActive = false;
    document.getElementById("game-screen").style.display = "none";
    document.getElementById("end-overlay").style.display = "flex";

    document.getElementById("end-name").innerText = siswaNama;
    document.getElementById("end-score").innerText = totalSkor + " Poin";

    let komentar = "";
    if (totalSkor >= 100) komentar = "🏆 Luar Biasa! Kamu Juara Umum Pembalap Labirin Dinamis!";
    else if (totalSkor >= 70) komentar = "👍 Hebat! Kamu berhasil melewati semua tantangan lintasan!";
    else komentar = "📚 Jangan patah semangat, terus belajar membaca dan berhitung ya!";

    document.getElementById("end-comment").innerText = komentar;
}

window.addEventListener('resize', () => {
    if (gameActive) initLayout();
});
</script>
